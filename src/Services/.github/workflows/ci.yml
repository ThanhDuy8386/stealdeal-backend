name: Backend CI

on:
  # Chạy khi có code mới được push lên bất kỳ branch nào.
  push:
    branches:
      - duy-dev

  # Chạy lại các kiểm tra khi mở hoặc cập nhật Pull Request.

permissions:
  contents: read

jobs:
  dotnet:
    name: Build and test .NET services
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: |
          dotnet restore Identity/StealDeal.Services.Identity.slnx
          dotnet restore Store/StealDeal.Services.Store.slnx
          dotnet restore Cart/StealDeal.Services.Cart.slnx
          dotnet restore Order/StealDeal.Services.Order.slnx
          dotnet restore Payment/StealDeal.Services.Payment.slnx
          dotnet restore Notification/StealDeal.Services.Notification.slnx

      - name: Build services
        run: |
          dotnet build Identity/StealDeal.Services.Identity.slnx --configuration Release --no-restore
          dotnet build Store/StealDeal.Services.Store.slnx --configuration Release --no-restore
          dotnet build Cart/StealDeal.Services.Cart.slnx --configuration Release --no-restore
          dotnet build Order/StealDeal.Services.Order.slnx --configuration Release --no-restore
          dotnet build Payment/StealDeal.Services.Payment.slnx --configuration Release --no-restore
          dotnet build Notification/StealDeal.Services.Notification.slnx --configuration Release --no-restore

      - name: Run tests
        run: |
          dotnet test Identity/StealDeal.Services.Identity.slnx --configuration Release --no-build
          dotnet test Store/StealDeal.Services.Store.slnx --configuration Release --no-build
          dotnet test Cart/StealDeal.Services.Cart.slnx --configuration Release --no-build
          dotnet test Order/StealDeal.Services.Order.slnx --configuration Release --no-build
          dotnet test Payment/StealDeal.Services.Payment.slnx --configuration Release --no-build
          dotnet test Notification/StealDeal.Services.Notification.slnx --configuration Release --no-build

  docker:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: dotnet

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build Identity image
        run: docker build --provenance=false --sbom=false -f Identity/Dockerfile -t stealdeal/identity:ci-${{ github.sha }} Identity

      - name: Build Store image
        run: docker build --provenance=false --sbom=false -f Store/Dockerfile -t stealdeal/store:ci-${{ github.sha }} Store

      - name: Build Cart image
        run: docker build --provenance=false --sbom=false -f Cart/Dockerfile -t stealdeal/cart:ci-${{ github.sha }} Cart

      - name: Build Order image
        run: docker build --provenance=false --sbom=false -f Order/Dockerfile -t stealdeal/order:ci-${{ github.sha }} Order

      - name: Build Payment image
        run: docker build --provenance=false --sbom=false -f Payment/Dockerfile -t stealdeal/payment:ci-${{ github.sha }} Payment

      - name: Build Notification image
        run: docker build --provenance=false --sbom=false -f Notification/Dockerfile -t stealdeal/notification:ci-${{ github.sha }} Notification

      - name: Build database migrator image
        run: docker build --provenance=false --sbom=false -f database/DatabaseMigrator/Dockerfile -t stealdeal/database-migrator:ci-${{ github.sha }} .
