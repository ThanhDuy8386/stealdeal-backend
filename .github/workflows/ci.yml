name: Backend CI

on:
  # Chạy khi có code mới được push lên bất kỳ branch nào.
  push:
    branches:
      - duy-dev

  # Chạy lại các kiểm tra khi mở hoặc cập nhật Pull Request.

permissions:
  contents: read

jobs:
  dotnet:
    name: Build and test .NET services
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: |
          dotnet restore src/Services/Identity/StealDeal.Services.Identity.slnx
          dotnet restore src/Services/Store/StealDeal.Services.Store.slnx
          dotnet restore src/Services/Cart/StealDeal.Services.Cart.slnx
          dotnet restore src/Services/Order/StealDeal.Services.Order.slnx
          dotnet restore src/Services/Payment/StealDeal.Services.Payment.slnx
          dotnet restore src/Services/Notification/StealDeal.Services.Notification.slnx

      - name: Build services
        run: |
          dotnet build src/Services/Identity/StealDeal.Services.Identity.slnx --configuration Release --no-restore
          dotnet build src/Services/Store/StealDeal.Services.Store.slnx --configuration Release --no-restore
          dotnet build src/Services/Cart/StealDeal.Services.Cart.slnx --configuration Release --no-restore
          dotnet build src/Services/Order/StealDeal.Services.Order.slnx --configuration Release --no-restore
          dotnet build src/Services/Payment/StealDeal.Services.Payment.slnx --configuration Release --no-restore
          dotnet build src/Services/Notification/StealDeal.Services.Notification.slnx --configuration Release --no-restore

      - name: Run tests
        run: |
          dotnet test src/Services/Identity/StealDeal.Services.Identity.slnx --configuration Release --no-build
          dotnet test src/Services/Store/StealDeal.Services.Store.slnx --configuration Release --no-build
          dotnet test src/Services/Cart/StealDeal.Services.Cart.slnx --configuration Release --no-build
          dotnet test src/Services/Order/StealDeal.Services.Order.slnx --configuration Release --no-build
          dotnet test src/Services/Payment/StealDeal.Services.Payment.slnx --configuration Release --no-build
          dotnet test src/Services/Notification/StealDeal.Services.Notification.slnx --configuration Release --no-build

  docker:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: dotnet

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build Identity image
        run: docker build --provenance=false --sbom=false -f src/Services/Identity/Dockerfile -t stealdeal/identity:ci-${{ github.sha }} src/Services/Identity

      - name: Build Store image
        run: docker build --provenance=false --sbom=false -f src/Services/Store/Dockerfile -t stealdeal/store:ci-${{ github.sha }} src/Services/Store

      - name: Build Cart image
        run: docker build --provenance=false --sbom=false -f src/Services/Cart/Dockerfile -t stealdeal/cart:ci-${{ github.sha }} src/Services/Cart

      - name: Build Order image
        run: docker build --provenance=false --sbom=false -f src/Services/Order/Dockerfile -t stealdeal/order:ci-${{ github.sha }} src/Services/Order

      - name: Build Payment image
        run: docker build --provenance=false --sbom=false -f src/Services/Payment/Dockerfile -t stealdeal/payment:ci-${{ github.sha }} src/Services/Payment

      - name: Build Notification image
        run: docker build --provenance=false --sbom=false -f src/Services/Notification/Dockerfile -t stealdeal/notification:ci-${{ github.sha }} src/Services/Notification

      - name: Build database migrator image
        run: docker build --provenance=false --sbom=false -f src/Services/database/DatabaseMigrator/Dockerfile -t stealdeal/database-migrator:ci-${{ github.sha }} src/Services
