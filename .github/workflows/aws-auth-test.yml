name: AWS Authentication Test

on:
  workflow_dispatch:
  push:
    branches:
      - duy-dev

permissions:
  contents: read

jobs:
  aws-auth:
    name: Verify AWS IAM credentials
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
          allowed-account-ids: ${{ secrets.AWS_ACCOUNT_ID }}

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Verify backend ECR repositories
        run: |
          aws ecr describe-repositories \
            --region us-east-1 \
            --repository-names \
              stealdeal-identity \
              stealdeal-store \
              stealdeal-cart \
              stealdeal-order \
              stealdeal-payment \
              stealdeal-notification \
              stealdeal-database-migrator

      - name: Verify EC2 instance
        run: |
          aws ec2 describe-instances \
            --region us-east-1 \
            --instance-ids i-012543d83b62f9bff \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text